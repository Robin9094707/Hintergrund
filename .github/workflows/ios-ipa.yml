name: iOS · Build unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      BUNDLE_ID: eu.robinjuhas.rjwallpaper
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        shell: bash
        run: |
          for XCODE in /Applications/Xcode_27.2.app /Applications/Xcode_27.2.0.app; do
            if [ -d "$XCODE/Contents/Developer" ]; then
              sudo xcode-select --switch "$XCODE/Contents/Developer"
              break
            fi
          done
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version"
          grep -q '^Xcode 27' "$RUNNER_TEMP/xcode-version"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build iPhone app
        run: |
          xcodebuild -project RJWallpaper.xcodeproj -scheme RJWallpaper \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build -quiet

      - name: Package unsigned IPA
        run: |
          mkdir -p dist "$RUNNER_TEMP/ipa/Payload"
          APP="$RUNNER_TEMP/device/Build/Products/Release-iphoneos/RJWallpaper.app"
          test -x "$APP/RJWallpaper"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = "$BUNDLE_ID"
          test "$(lipo -archs "$APP/RJWallpaper")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print UIBackgroundModes:0' "$APP/Info.plist")" = audio
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/RJWallpaper.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/RJ-Wallpaper-Studio-${VERSION}-unsigned.ipa" Payload)
          unzip -tq dist/*.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: RJ-Wallpaper-Studio-unsigned
          path: dist/*.ipa
          if-no-files-found: error

      - name: Build simulator app
        timeout-minutes: 5
        run: |
          xcodebuild -project RJWallpaper.xcodeproj -scheme RJWallpaper \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sim" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build -quiet

      - name: Boot iPhone simulator
        timeout-minutes: 7
        shell: bash
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${SDK//./-}"
          xcrun simctl list runtimes available
          DEVICE="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"].get(sys.argv[1], [])
          iphones = [d for d in devices if d["name"].startswith("iPhone") and d["isAvailable"]]
          if iphones:
              print(next((d for d in iphones if d["name"] == "iPhone 18 Pro"), iphones[0])["udid"])
          ' "$RUNTIME")"
          if [ -z "$DEVICE" ]; then
            DEVICE="$(xcrun simctl create RJ-Test-iPhone com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$RUNTIME")"
          fi
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Launch app and verify 4K export and animated cover
        timeout-minutes: 4
        run: |
          DEVICE="$SIMULATOR_ID"
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/RJWallpaper.app"
          xcrun simctl launch "$DEVICE" "$BUNDLE_ID" --ci-smoke
          CONTAINER="$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE_ID" data)"
          for _ in $(seq 1 25); do
            if [ -f "$CONTAINER/Library/Caches/rj-smoke.txt" ]; then break; fi
            sleep 2
          done
          cat "$CONTAINER/Library/Caches/rj-smoke.txt"
          grep -qx '4K export, animated cover and audio playback passed' "$CONTAINER/Library/Caches/rj-smoke.txt"
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/RJ-Wallpaper-Simulator.png"
          xcrun simctl terminate "$DEVICE" "$BUNDLE_ID"

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v6
        with:
          name: RJ-Wallpaper-Simulator
          path: ${{ runner.temp }}/RJ-Wallpaper-Simulator.png
          if-no-files-found: error
